[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
repository = "https://github.com/ebnsina/sahl"

[workspace.dependencies]
sahl-core = { path = "crates/sahl-core" }
sahl-fiscal = { path = "crates/sahl-fiscal" }

serde = { version = "1", features = ["derive"] }
# NOTE: `preserve_order` is deliberately NOT enabled. Without it, `serde_json::Value` objects are
# backed by a BTreeMap, so keys serialize in sorted order — which is exactly what canonical hashing
# of the event log requires. Turning it on would make event hashes depend on field insertion order.
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
sha2 = "0.10"
hex = "0.4"

# dev
proptest = "1"
rstest = "0.24"

# server
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace", "cors", "limit"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time", "json", "migrate", "macros",
] }
ed25519-dalek = { version = "3", features = ["rand_core", "pkcs8"] }
rand = "0.9"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# The money rules. These are not style preferences — a silent wrap or a
# truncating cast in this codebase is a financial defect.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
