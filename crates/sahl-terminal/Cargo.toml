[package]
name = "sahl-terminal"
description = "The Sahl till: Tauri shell, local event store, and hardware. Offline-first."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Tauri's mobile targets require a library entry point; the binary is a thin wrapper.
name = "sahl_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
sahl-core = { workspace = true }

tauri = { workspace = true }
rusqlite = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
