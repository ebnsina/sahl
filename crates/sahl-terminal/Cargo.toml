[package]
name = "sahl-terminal"
description = "The Sahl till: Tauri shell, local event store, and hardware. Offline-first."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Tauri's mobile targets require a library entry point; the binary is a thin wrapper.
name = "sahl_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
sahl-core = { workspace = true }
argon2 = { workspace = true }
sahl-sync = { workspace = true }

tauri = { workspace = true }
rusqlite = { workspace = true }

base64 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
sahl-server = { path = "../sahl-server" }
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { workspace = true }

[lints]
workspace = true
