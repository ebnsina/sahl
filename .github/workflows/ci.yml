name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere. The workspace lints treat unchecked arithmetic, float maths, and
  # unwrap as errors already; this stops anything else creeping in.
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest

    # The sync suite needs a real database: its behaviour is transactional and RLS-scoped, and an
    # in-memory stand-in would prove nothing about either.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sahl_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      # sahl-terminal pulls in Tauri, which links GTK and WebKit. The till itself ships on Windows
      # and Android, but CI still compiles it here to catch ordinary Rust errors.
      - name: Install Tauri system libraries
        # Each attempt gets its own timeout via `timeout`, so a hung mirror is abandoned in two
        # minutes and the next attempt starts. A step-level timeout cannot do this: it kills the
        # retry loop along with the stall, which is how the first version of this failed — three
        # attempts that never had room to run.
        # DEBIAN_FRONTEND stops any package stopping to ask a question nobody is there to answer.
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          packages="libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
                    librsvg2-dev libxdo-dev libssl-dev"
          for attempt in 1 2 3; do
            if timeout 120 sudo -E apt-get update -qq \
               && timeout 180 sudo -E apt-get install -y -qq --no-install-recommends $packages; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep 10
          done
          exit 1

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Migrate and create the runtime role, so the sync suite runs as sahl_app — NOSUPERUSER
      # NOBYPASSRLS. Locally these tests usually run as a superuser, which bypasses RLS and proves
      # less than it looks.
      - name: Prepare the sync test database
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sahl_ci
        run: |
          for file in crates/sahl-server/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE sahl_app LOGIN PASSWORD 'ci' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO sahl_app;
          GRANT SELECT, INSERT, UPDATE ON tenant, outlet, app_user, device, enrollment_token TO sahl_app;
          GRANT SELECT, INSERT ON event TO sahl_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO sahl_app;
          -- device_tenant is REVOKEd from PUBLIC by its migration, so the runtime role needs an
          -- explicit grant. Without it every request fails authentication.
          GRANT EXECUTE ON FUNCTION device_tenant(UUID) TO sahl_app;
          GRANT EXECUTE ON FUNCTION enrollment_token_for_digest(BYTEA) TO sahl_app;
          SQL

      # Includes the property suites (money allocation laws, VAT invariants, chain-integrity
      # fuzzing) and the sync ingest suite against the database above.
      - name: Test
        # Bounded so a deadlock in the sync threads surfaces as a failure rather than a job that
        # silently runs until the platform kills it.
        timeout-minutes: 15
        env:
          SAHL_TEST_DATABASE_URL: postgres://sahl_app:ci@localhost:5432/sahl_ci
        run: cargo test --workspace

  migrations:
    name: Migrations — apply and prove isolation
    runs-on: ubuntu-latest

    # These checks are the reason tenant isolation can be claimed at all. They run against a real
    # Postgres because RLS cannot be unit-tested: policies that look right and do nothing are exactly
    # the failure being guarded against.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sahl_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGUSER: postgres
      # Superuser password, used for the migration and role-creation steps. Steps acting as the
      # runtime role override this inline with PGPASSWORD=ci — the service container authenticates
      # over TCP with scram, so an unset or wrong password fails rather than falling back to trust.
      PGPASSWORD: postgres
      PGDATABASE: sahl_ci

    steps:
      - uses: actions/checkout@v7

      - name: Apply migrations
        # Whole directory, in order — naming one file means a new migration is silently skipped.
        run: |
          for file in crates/sahl-server/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Create the runtime role
        # Mirrors production exactly: NOSUPERUSER NOBYPASSRLS, and no UPDATE or DELETE on the event
        # log. Testing as a superuser would silently pass no matter what the policies said.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE sahl_app LOGIN PASSWORD 'ci' NOSUPERUSER NOBYPASSRLS;
          GRANT SELECT, INSERT, UPDATE ON tenant, outlet, app_user, device, enrollment_token TO sahl_app;
          GRANT SELECT, INSERT ON event TO sahl_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO sahl_app;
          -- device_tenant is REVOKEd from PUBLIC by its migration, so the runtime role needs an
          -- explicit grant. Without it every request fails authentication.
          GRANT EXECUTE ON FUNCTION device_tenant(UUID) TO sahl_app;
          GRANT EXECUTE ON FUNCTION enrollment_token_for_digest(BYTEA) TO sahl_app;
          SQL

      - name: Seed two merchants
        run: |
          PGPASSWORD=ci psql -v ON_ERROR_STOP=1 -U sahl_app <<'SQL'
          BEGIN;
          SELECT set_config('sahl.tenant_id', '11111111-1111-1111-1111-111111111111', true);
          INSERT INTO tenant (id, name, country_code, default_currency)
          VALUES ('11111111-1111-1111-1111-111111111111', 'Karim Store', 'BD', 'BDT');
          INSERT INTO outlet (id, tenant_id, name, profile, timezone, currency)
          VALUES ('aaaaaaaa-0000-0000-0000-000000000001','11111111-1111-1111-1111-111111111111',
                  'Dhaka Main','retail','Asia/Dhaka','BDT');
          INSERT INTO device (id, tenant_id, outlet_id, label, public_key)
          VALUES ('dddddddd-0000-0000-0000-000000000001','11111111-1111-1111-1111-111111111111',
                  'aaaaaaaa-0000-0000-0000-000000000001','Till 1', decode(repeat('ab',32),'hex'));
          INSERT INTO event (event_id, tenant_id, outlet_id, device_id, device_seq, occurred_at,
                             kind, payload, prev_hash, hash)
          VALUES ('eeeeeeee-0000-0000-0000-000000000001','11111111-1111-1111-1111-111111111111',
                  'aaaaaaaa-0000-0000-0000-000000000001','dddddddd-0000-0000-0000-000000000001',
                  1, 1753000000000, 'sale.completed', '{"total_minor":49372}'::jsonb,
                  decode(repeat('00',32),'hex'), decode(repeat('11',32),'hex'));
          COMMIT;

          BEGIN;
          SELECT set_config('sahl.tenant_id', '22222222-2222-2222-2222-222222222222', true);
          INSERT INTO tenant (id, name, country_code, default_currency)
          VALUES ('22222222-2222-2222-2222-222222222222', 'Riyadh Cafe', 'SA', 'SAR');
          INSERT INTO outlet (id, tenant_id, name, profile, timezone, currency)
          VALUES ('bbbbbbbb-0000-0000-0000-000000000001','22222222-2222-2222-2222-222222222222',
                  'Olaya','cafe','Asia/Riyadh','SAR');
          COMMIT;
          SQL

      - name: A tenant sees only its own rows
        run: |
          PGPASSWORD=ci psql -v ON_ERROR_STOP=1 -U sahl_app -tAc "
            BEGIN;
            SELECT set_config('sahl.tenant_id', '11111111-1111-1111-1111-111111111111', true);
            DO \$\$ BEGIN
              IF (SELECT count(*) FROM outlet) <> 1 THEN
                RAISE EXCEPTION 'tenant isolation broken: expected 1 outlet, saw %', (SELECT count(*) FROM outlet);
              END IF;
            END \$\$;
            COMMIT;"

      - name: An unscoped connection sees nothing
        # Fail closed. If this ever passes with rows visible, every merchant's data is readable by
        # any request that forgot to set its scope.
        run: |
          PGPASSWORD=ci psql -v ON_ERROR_STOP=1 -U sahl_app -tAc "
            DO \$\$ BEGIN
              IF (SELECT count(*) FROM outlet) <> 0 OR (SELECT count(*) FROM event) <> 0 THEN
                RAISE EXCEPTION 'RLS does not fail closed: unscoped connection saw rows';
              END IF;
            END \$\$;"

      - name: A cross-tenant insert is refused
        run: |
          if PGPASSWORD=ci psql -v ON_ERROR_STOP=1 -U sahl_app -tAc "
            BEGIN;
            SELECT set_config('sahl.tenant_id', '11111111-1111-1111-1111-111111111111', true);
            INSERT INTO outlet (id, tenant_id, name, profile, timezone, currency)
            VALUES ('cccccccc-0000-0000-0000-000000000001','22222222-2222-2222-2222-222222222222',
                    'Smuggled','retail','Asia/Dhaka','BDT');
            COMMIT;" 2>/dev/null; then
            echo "::error::a tenant was able to insert rows owned by another tenant"
            exit 1
          fi
          echo "cross-tenant insert refused, as expected"

      - name: The event log is append-only even when UPDATE and DELETE are granted
        # Granted deliberately: without this the GRANT does the work and the trigger is never
        # exercised, which would leave the append-only guarantee untested.
        run: |
          psql -v ON_ERROR_STOP=1 -c "GRANT UPDATE, DELETE ON event TO sahl_app;"
          for op in "UPDATE event SET payload = '{}'::jsonb" "DELETE FROM event"; do
            if PGPASSWORD=ci psql -v ON_ERROR_STOP=1 -U sahl_app -tAc "
              BEGIN;
              SELECT set_config('sahl.tenant_id', '11111111-1111-1111-1111-111111111111', true);
              $op WHERE device_seq = 1;
              COMMIT;" 2>/dev/null; then
              echo "::error::the append-only trigger did not block: $op"
              exit 1
            fi
            echo "blocked, as expected: $op"
          done

  frontend:
    name: Frontend — lint, check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fonts are committed, not fetched at build time
        # The terminal is offline-first, so the typefaces ship inside the binary. If this ever fails,
        # the app silently renders in system fallbacks — invisible in a production build and exactly
        # the failure the bundling rule exists to prevent.
        run: |
          count=$(find packages/ui/fonts -name '*.woff2' | wc -l)
          if [ "$count" -lt 9 ]; then
            echo "::error::expected 9 bundled woff2 files, found $count — run pnpm --filter @sahl/ui fetch-fonts"
            exit 1
          fi
          echo "$count bundled font files present"

      - run: pnpm exec prettier --check "**/*.{ts,js,mjs,svelte,css,json}"

      - run: pnpm -r check

      - name: Unit tests
        # Only `packages/ui` has any: it holds the one function in TypeScript that turns a keyboard
        # entry into a money value, which is the single place JS can put a wrong number into the log.
        run: pnpm -r test

      - run: pnpm -r build
